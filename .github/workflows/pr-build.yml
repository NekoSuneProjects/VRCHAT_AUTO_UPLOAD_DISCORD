name: PR Build Check

on:
  pull_request:
    branches: [ DEV, BETA, RELEASE, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Publish (smoke test)
        run: dotnet publish "VRCX Image Discord Uploader/VRCX Image Discord Uploader.csproj" -c Release -r win-x64 --self-contained true -o dist

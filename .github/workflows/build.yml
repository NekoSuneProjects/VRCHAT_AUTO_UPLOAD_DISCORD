name: Windows Release Build + ZIP

permissions:
  contents: write

on:
  push:
    branches:
      - RELEASE
      - BETA

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ==========================
      # Checkout
      # ==========================
      - name: Checkout
        uses: actions/checkout@v7

      # ==========================
      # Setup .NET
      # ==========================
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # ==========================
      # Get Version from csproj
      # ==========================
      - name: Get Version
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          $xml = [xml](Get-Content $csproj.FullName)

          $version = $xml.Project.PropertyGroup.Version

          if (-not $version) {
            $version = "1.0.0"
          }

          echo "BASE_VERSION=$version" >> $env:GITHUB_ENV

      # ==========================
      # Determine Channel + Version
      # ==========================
      - name: Determine Version
        shell: pwsh
        run: |
          $base = $env:BASE_VERSION

          if (-not $base -or $base.Trim() -eq "") {
            $base = "1.0.0"
          }

          if ("${{ github.ref_name }}" -eq "BETA") {
            $CHANNEL="beta"
            $TAG="BETA-${{ github.run_number }}"
            $VERSION="$base-beta-${{ github.run_number }}"
            $RELEASE_NAME="VRCX Image Discord Uploader BETA v$base-${{ github.run_number }}"
          } else {
            $CHANNEL="release"
            $TAG="$base"
            $VERSION="$base"
            $RELEASE_NAME="VRCX Image Discord Uploader $base"
          }

          echo "CHANNEL=$CHANNEL" >> $env:GITHUB_ENV
          echo "TAG=$TAG" >> $env:GITHUB_ENV
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $env:GITHUB_ENV

      # ==========================
      # Restore
      # ==========================
      - name: Restore
        run: dotnet restore

      # ==========================
      # Build
      # ==========================
      - name: Build Release
        run: dotnet build -c Release --no-restore

      # ==========================
      # Publish EXE
      # ==========================
      - name: Publish
        # InformationalVersion = "2.1.0" or "2.1.0-beta-<run>" – the in-app update checker reads it.
        run: dotnet publish -c Release -r win-x64 --self-contained true -o dist -p:InformationalVersion=${{ env.VERSION }} -p:IncludeSourceRevisionInInformationalVersion=false

      # ==========================
      # Create ZIP FILE
      # ==========================
      - name: Create ZIP Package
        shell: pwsh
        run: |
          $zipName = "VRCX-Image-Discord-Uploader-${{ env.VERSION }}.zip"
          Compress-Archive -Path dist\* -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      # ==========================
      # List files (debug)
      # ==========================
      - name: List Files
        run: dir

      # ==========================
      # Release Notes
      # ==========================
      - name: Release Notes from CHANGELOG.md
        shell: pwsh
        run: |
          # Copy the "## <version>" section of CHANGELOG.md into the release description.
          # The app reads release descriptions for "What's new" and stops at <!-- app-notes-end -->.
          $base = $env:BASE_VERSION
          $section = New-Object System.Collections.Generic.List[string]
          $inside = $false
          foreach ($line in (Get-Content -Path CHANGELOG.md -Encoding utf8)) {
            if ($line -match '^##\s+\[?v?(\d+\.\d+\.\d+)') {
              if ($inside) { break }
              if ($Matches[1] -eq $base) { $inside = $true }
              continue
            }
            if ($inside -and $line -match '^## ') { break }
            if ($inside) { $section.Add($line) }
          }
          $notes = ($section -join "`n").Trim()
          if (-not $notes) {
            echo "::warning title=CHANGELOG.md::No '## $base' section found - add one so the release and the app show what changed."
            $notes = "No changelog entry for $base yet."
          }
          if ($env:CHANNEL -eq "beta") {
            $notes = "> Beta build $($env:VERSION) - may contain bugs.`n`n$notes"
          }
          $download = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$($env:TAG)/$($env:ZIP_NAME)"
          $body = "$notes`n`n<!-- app-notes-end -->`n---`n**Download ZIP:** $download"
          Set-Content -Path release_notes.md -Value $body -Encoding utf8
          Get-Content release_notes.md

      # ==========================
      # GitHub Release + Upload ZIP
      # ==========================
      - name: Create Release + Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          # beta builds are pre-releases, so the app only offers them to people who opt in
          prerelease: ${{ env.CHANNEL == 'beta' }}
          body_path: release_notes.md
          files: |
            ${{ env.ZIP_NAME }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

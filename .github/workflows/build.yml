name: Windows Release Build + ZIP

permissions:
  contents: write

on:
  push:
    branches:
      - RELEASE
      - BETA

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ==========================
      # Checkout
      # ==========================
      - name: Checkout
        uses: actions/checkout@v7

      # ==========================
      # Setup .NET
      # ==========================
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # ==========================
      # Get Version from csproj
      # ==========================
      - name: Get Version
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          $xml = [xml](Get-Content $csproj.FullName)

          $version = $xml.Project.PropertyGroup.Version

          if (-not $version) {
            $version = "1.0.0"
          }

          echo "BASE_VERSION=$version" >> $env:GITHUB_ENV

      # ==========================
      # Determine Channel + Version
      # ==========================
      - name: Determine Version
        shell: pwsh
        run: |
          $base = $env:BASE_VERSION

          if (-not $base -or $base.Trim() -eq "") {
            $base = "1.0.0"
          }

          if ("${{ github.ref_name }}" -eq "BETA") {
            $CHANNEL="beta"
            $TAG="BETA-${{ github.run_number }}"
            $VERSION="$base-beta-${{ github.run_number }}"
            $RELEASE_NAME="VRCX Image Discord Uploader BETA v$base-${{ github.run_number }}"
          } else {
            $CHANNEL="release"
            $TAG="$base"
            $VERSION="$base"
            $RELEASE_NAME="VRCX Image Discord Uploader $base"
          }

          echo "CHANNEL=$CHANNEL" >> $env:GITHUB_ENV
          echo "TAG=$TAG" >> $env:GITHUB_ENV
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $env:GITHUB_ENV

      # ==========================
      # Restore
      # ==========================
      - name: Restore
        run: dotnet restore

      # ==========================
      # Build
      # ==========================
      - name: Build Release
        run: dotnet build -c Release --no-restore

      # ==========================
      # Publish EXE
      # ==========================
      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained true -o dist

      # ==========================
      # Create ZIP FILE
      # ==========================
      - name: Create ZIP Package
        shell: pwsh
        run: |
          $zipName = "VRCX-Image-Discord-Uploader-${{ env.VERSION }}.zip"
          Compress-Archive -Path dist\* -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      # ==========================
      # List files (debug)
      # ==========================
      - name: List Files
        run: dir

      # ==========================
      # Release Notes
      # ==========================
      - name: Generate Release Notes
        id: notes
        uses: release-drafter/release-drafter@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # v7 builds "github:" config paths with "\" on Windows runners (404 from the API),
          # so read the checked-out file from disk instead.
          config-name: file:release-drafter.yml
          version: ${{ env.VERSION }}
          name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG }}

      # ==========================
      # GitHub Release + Upload ZIP
      # ==========================
      - name: Create Release + Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ${{ steps.notes.outputs.body }}

            **Download ZIP**
            https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/${{ env.ZIP_NAME }}
          files: |
            ${{ env.ZIP_NAME }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
